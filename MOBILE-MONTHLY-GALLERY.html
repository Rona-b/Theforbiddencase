<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mobile Monthly Artwork</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #170e0c;
        color: #ead9b6;
        font-family: Georgia, serif;
      }
      h1 {
        text-align: center;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        justify-content: center;
      }
      figure {
        margin: 0;
        flex: 0 1 260px;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
      }
      figcaption {
        text-align: center;
        padding: 12px;
        font-size: 20px;
      }
      p {
        text-align: center;
        line-height: 1.6;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Monthly Phone & Tablet Bookshelves</h1>
    <p>
      12 matching portrait backgrounds. Click any image to open it full size.<br />Desktop
      artwork remains in images/monthly/. Mobile artwork is in
      images/mobile-monthly/.
    </p>
    <main>
      <figure>
        <a href="images/mobile-monthly/01-january.png"
          ><img
            src="images/mobile-monthly/01-january.png"
            alt="January mobile bookshelf"
            loading="lazy"
        /></a>
        <figcaption>January</figcaption>
      </figure>
