<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your 12 monthly bookshelf decorations</title>
    <style>
      body {
        margin: 0;
        background: #150e0a;
        color: #eedcba;
        font:
          16px Georgia,
          serif;
        padding: 30px;
      }
      h1 {
        font-size: 35px;
        text-align: center;
        font-weight: 400;
      }
      p {
        text-align: center;
        color: #bea079;
        line-height: 1.6;
      }
      a {
        color: #dec08a;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
        max-width: 1600px;
        margin: 30px auto;
      }
      figure {
        margin: 0;
        border: 1px solid #866039;
        background: #22140c;
        border-radius: 5px;
        overflow: hidden;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
      figcaption {
        padding: 15px;
        text-align: center;
      }
      figcaption strong {
        display: block;
        font-weight: 400;
        font-size: 23px;
      }
      figcaption span {
        font:
          12px/2 Arial,
          sans-serif;
        color: #c2a77e;
      }
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 550px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <a href="index.html">← Back to your website</a>
    <h1>A year in the Forbidden Library</h1>
    <p>
      The same bookshelf, dressed for every month.<br />Click a picture to view
      the full-size asset. The website changes automatically each month. Set the
      theme in content.js and initial-content.json to choose a specific month.
    </p>
